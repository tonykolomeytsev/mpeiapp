# The Xcode project is generated by XcodeGen (https://github.com/yonaskolb/XcodeGen) so that it does not have to
# be edited by hand or committed: `cd iosApp && xcodegen generate`, then open iosApp.xcodeproj on a Mac.
name: iosApp
options:
  bundleIdPrefix: ru.mpei
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: ru.mpei.hub
    MARKETING_VERSION: "0.5.2"
    CURRENT_PROJECT_VERSION: "64"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    # the Gradle build phase below writes the framework outside of the sandbox
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../modules/shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
    OTHER_LDFLAGS: "$(inherited) -framework Shared"
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: "МЭИ.Хаб"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    preBuildScripts:
      - name: Build the Shared framework with Gradle
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
