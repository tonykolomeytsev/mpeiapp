name: Release APK

# Builds the signed release APK and publishes it to GitHub Releases.
#  - push of a tag `vX.Y.Z`  -> build + publish the release for that tag
#  - manual run (Actions -> Release APK -> Run workflow):
#      publish = false  -> only build and check (unit tests + APK artifact)
#      publish = true   -> build and publish the release for `tag`
#
# Signing uses `keystore/release.keystore` from the repository (see AndroidSigningConventionPlugin),
# so the APK is signed with the same key as the previous releases and installs over them.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.4.0"
        required: false
        default: ""
      publish:
        description: "Publish the GitHub Release (false = only build and test)"
        type: boolean
        default: false

env:
  GRADLE_OPTS: "-Dorg.gradle.unsafe.configuration-cache=false -Dorg.gradle.daemon=false"

jobs:
  build:
    name: Build, test, sign
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      apk_name: ${{ steps.apk.outputs.apk_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: adopt

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # gradlew may lose the executable bit when the repository is edited on Windows
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --continue
        env:
          MAP_KEY: ${{ secrets.MAP_KEY }}

      - name: Build release APK
        run: ./gradlew :app:assembleRelease
        env:
          MAP_KEY: ${{ secrets.MAP_KEY }}

      - name: Locate APK
        id: apk
        run: |
          APK=$(ls modules/app/build/outputs/apk/release/*.apk | head -n 1)
          echo "Built: $APK"
          echo "apk_name=$(basename "$APK")" >> "$GITHUB_OUTPUT"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Verify signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "${{ steps.apk.outputs.apk_path }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: modules/app/build/outputs/apk/release/*.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            modules/**/build/reports/tests/
            modules/**/build/test-results/
          if-no-files-found: ignore

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish && inputs.tag != '')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: dist

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: МЭИ.Хаб ${{ steps.tag.outputs.name }}
          body_path: .github/release-notes.md
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: dist/*.apk
