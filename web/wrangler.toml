name = "mpei-next-web"
main = "worker/index.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./public"
binding = "ASSETS"
# запросы к API и push обрабатывает воркер, всё остальное — статика
run_worker_first = ["/api/*", "/push/*"]

# wrangler kv namespace create SUBS  ->  подставьте полученный id
[[kv_namespaces]]
binding = "SUBS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[triggers]
crons = ["*/30 * * * *"]

[vars]
# контакт для push-сервисов (требование VAPID)
VAPID_SUBJECT = "mailto:you@example.com"
# публичный ключ из `npm run vapid`
VAPID_PUBLIC_KEY = ""
# секрет VAPID_PRIVATE_JWK задаётся командой: wrangler secret put VAPID_PRIVATE_JWK
