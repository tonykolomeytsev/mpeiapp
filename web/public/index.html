<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MpeiX Next</title>
  <meta name="description" content="Расписание МЭИ: пары, аудитории, уведомления об изменениях">
  <meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MpeiX">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button id="btn-pick" class="title-btn" type="button" aria-label="Выбрать группу или преподавателя">
        <span id="title">Выберите группу</span>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M7 10l5 5 5-5z" fill="currentColor"/></svg>
      </button>
      <button id="btn-settings" class="icon-btn" type="button" aria-label="Настройки">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M12 8a4 4 0 100 8 4 4 0 000-8zm8.94 5a7.97 7.97 0 000-2l2.03-1.58a.5.5 0 00.12-.64l-1.92-3.32a.5.5 0 00-.6-.22l-2.39.96a7.8 7.8 0 00-1.73-1l-.36-2.54A.5.5 0 0014.6 2h-3.84a.5.5 0 00-.5.42l-.36 2.54c-.62.25-1.2.58-1.73 1l-2.39-.96a.5.5 0 00-.6.22L3.26 8.54a.5.5 0 00.12.64L5.4 10.8a7.97 7.97 0 000 2.4l-2.02 1.58a.5.5 0 00-.12.64l1.92 3.32c.13.22.4.3.6.22l2.39-.96c.53.42 1.11.75 1.73 1l.36 2.54c.04.24.25.42.5.42h3.84c.25 0 .46-.18.5-.42l.36-2.54c.62-.25 1.2-.58 1.73-1l2.39.96c.22.08.47 0 .6-.22l1.92-3.32a.5.5 0 00-.12-.64L20.94 13z"/></svg>
      </button>
    </header>

    <nav class="weekbar" aria-label="Неделя">
      <button id="btn-prev" class="icon-btn" type="button" aria-label="Предыдущая неделя">‹</button>
      <button id="btn-today" class="week-label" type="button">
        <span id="week-title">—</span>
        <small id="week-sub"></small>
      </button>
      <button id="btn-next" class="icon-btn" type="button" aria-label="Следующая неделя">›</button>
    </nav>

    <div id="days" class="days" role="tablist" aria-label="Дни недели"></div>
    <div id="status" class="status" role="status" hidden></div>
    <main id="content" class="content" aria-live="polite"></main>
  </div>

  <dialog id="dlg-search">
    <form method="dialog" class="sheet">
      <div class="sheet-head">
        <h2>Расписание</h2>
        <button class="icon-btn" value="close" aria-label="Закрыть">✕</button>
      </div>
      <div class="segmented" role="group" aria-label="Тип">
        <button type="button" id="seg-group" class="on">Группа</button>
        <button type="button" id="seg-person">Преподаватель</button>
      </div>
      <input id="search-input" type="search" inputmode="search" autocomplete="off"
             autocapitalize="off" placeholder="Например: ЭЛ-01-23">
      <ul id="search-results" class="results"></ul>
    </form>
  </dialog>

  <dialog id="dlg-settings">
    <form method="dialog" class="sheet">
      <div class="sheet-head">
        <h2>Настройки</h2>
        <button class="icon-btn" value="close" aria-label="Закрыть">✕</button>
      </div>
      <label class="row">
        <span>
          <strong>Уведомления об изменениях</strong>
          <small id="push-hint">Сообщим, если пары перенесут или отменят</small>
        </span>
        <input id="push-toggle" type="checkbox" role="switch">
      </label>
      <p id="install-hint" class="hint" hidden></p>
      <p class="hint">Данные расписания: ts.mpei.ru. Неофициальный клиент.</p>
    </form>
  </dialog>

  <script type="module" src="/app.js"></script>
</body>
</html>
