pluginManagement {
    includeBuild("build-logic")
    repositories {
        gradlePluginPortal()
        google()
    }
}

plugins {
    id("com.gradle.develocity") version "3.19.2"
}

// https://docs.gradle.com/enterprise/gradle-plugin/#controlling_when_build_scans_are_published
develocity {
    buildScan {
        uploadInBackground = false
        publishing.onlyIf { false }
        termsOfUseUrl = "https://gradle.com/help/legal-terms-of-use"
        termsOfUseAgree = "yes"
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        // First: a SNAPSHOT of the SDK published locally (`./gradlew publishToMavenLocal` in mpeix-sdk) wins over
        // the one on Central. Gradle takes a snapshot from the first repository that has it. To go back to Central,
        // delete ~/.m2/repository/io/github/tonykolomeytsev.
        mavenLocal {
            name = "MpeixSdkDevSnapshots"
            mavenContent { snapshotsOnly() }
            content { includeGroup("io.github.tonykolomeytsev") }
        }
        google()
        mavenCentral()
        maven {
            name = "CentralPortalSnapshots"
            url = uri("https://central.sonatype.com/repository/maven-snapshots/")
            mavenContent { snapshotsOnly() }
            content { includeGroup("io.github.tonykolomeytsev") }
        }
        // The private real runtime, only for builds with -Pmpeix.sdk.real (CI). Stub builds never touch it.
        // Credentials (a token with read:packages): githubPackagesUsername / githubPackagesPassword, or the
        // ghp_user / ghp_pass pair, in ~/.gradle/gradle.properties; on CI ORG_GRADLE_PROJECT_githubPackagesUsername/Password.
        if (providers.gradleProperty("mpeix.sdk.real").present || System.getenv("CI") == "true") {
            def ghUser = providers.gradleProperty("githubPackagesUsername").orElse(providers.gradleProperty("ghp_user"))
            def ghToken = providers.gradleProperty("githubPackagesPassword").orElse(providers.gradleProperty("ghp_pass"))
            if (!ghUser.present || !ghToken.present) {
                throw new GradleException(
                    "-Pmpeix.sdk.real needs GitHub Packages credentials: githubPackagesUsername / githubPackagesPassword " +
                        "(or ghp_user / ghp_pass) in ~/.gradle/gradle.properties"
                )
            }
            maven {
                name = "githubPackages"
                url = uri("https://maven.pkg.github.com/tonykolomeytsev/mpeix-sdk")
                credentials {
                    username = ghUser.get()
                    password = ghToken.get()
                }
                content { includeModuleByRegex("io\\.github\\.tonykolomeytsev", "mpeix-sdk-runtime(-.*)?") }
            }
        }
    }
    versionCatalogs.create("mpeix").from(files("gradle/mpeix.versions.toml"))
}

rootProject.name = "mpeix"

// Automatically add all project modules
def sourcesDir = layout.rootDirectory.dir("modules").asFile
fileTree(sourcesDir) {
    exclude("**/build/**", "**/src/**", "build-logic", ".*")
    include("*/**/build.gradle")
}.forEach { buildScriptFile ->
    def moduleDir = buildScriptFile.parentFile
    // do NOT use absolute paths, or Gradle will shit himself
    def relativePath = sourcesDir.toPath().relativize(moduleDir.toPath())
    def moduleName = ":$relativePath".replace(File.separator, "_")

    include(moduleName)
    project(moduleName).projectDir = moduleDir
}


