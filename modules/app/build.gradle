plugins {
    alias(mpeix.plugins.app)
    alias(mpeix.plugins.app.signing)
    alias(libs.plugins.google.services)
    alias(libs.plugins.firebase.crashlytics)
}

apply(from: "${rootProject.projectDir}/gradle/ci.gradle")

android {
    namespace = "kekmech.ru.mpeiapp"

    defaultConfig {
        applicationId = "kekmech.ru.mpeiapp"
        versionName = "2.6.0"
        versionCode = 62
        // Switches the app to the mock backend before it starts, see MpeixTestRunner
        testInstrumentationRunner = "kekmech.ru.mpeiapp.MpeixTestRunner"
        // Orchestrator wipes the app data before every test, so the tests don't depend on each other
        testInstrumentationRunnerArguments["clearPackageData"] = "true"
        ndk {
            abiFilters("armeabi-v7a", "arm64-v8a", "x86", "x86_64")
        }
    }

    testOptions {
        animationsDisabled = true
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            matchingFallbacks += ["debug"]
            signingConfig = signingConfigs.getByName("release")
        }
        qa {
            debuggable = false
            minifyEnabled = true
            shrinkResources = true
            applicationIdSuffix = ".dev"
            matchingFallbacks += ["debug"]
            signingConfig = signingConfigs.getByName("debug")
            firebaseCrashlytics {
                // A random mapping file id is injected on each upload-enabled build, so R8 never stays up-to-date locally
                mappingFileUploadEnabled = System.getenv("CI") == "true"
            }
        }
        debug {
            minifyEnabled = false
            applicationIdSuffix = ".dev"
        }
    }
    lint {
        checkReleaseBuilds = false
        checkDependencies = true
        ignoreTestSources = true
        checkAllWarnings = false
        lintConfig = rootProject.file("lint.xml")
    }
    buildFeatures {
        compose = true
    }
    packaging {
        // This is to make it possible to use Ktor (mock_server) on android
        // https://github.com/gnarea/minimal-ktor-server-android/blob/master/app/build.gradle
        resources.excludes += ["META-INF/**", "**/attach_hotspot_windows.dll"]
    }
    // https://developer.android.com/guide/app-bundle/configure-base#disable_config_apks
    bundle {
        // Because app has a runtime language selector
        language.enableSplit = false
    }
}

